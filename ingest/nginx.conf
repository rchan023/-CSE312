# Stream keys appear in internal RTMP paths, so do not log requests.
error_log /dev/stderr crit;
events {}
rtmp {
    server {
        listen 1935;
        application live {
            live on;
            deny play all;
            record off;
            access_log off;
            on_publish http://server:8080/api/live/start;
            on_publish_done http://server:8080/api/live/end;
            hls on;
            hls_path /hls;
            hls_nested on;
            hls_fragment 2s;
            hls_playlist_length 10s;
            hls_cleanup on;
        }
    }
}
