services:
  server:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable"
      MEDIA_DIR: /media
      HLS_DIR: /hls
    volumes:
      - media-data:/media
      - live-data:/hls:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 10s

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - chat-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 10s

  ingest:
    build: ./ingest
    ports:
      - "127.0.0.1:1935:1935"
    volumes:
      - live-data:/hls
    depends_on:
      server:
        condition: service_healthy

volumes:
  chat-data:
  media-data:
  live-data:
