# Stream keys appear in internal RTMP paths, so keep request logging off.
error_log /dev/stderr crit;
events {}
rtmp {
    server {
        listen 1935;
        application live {
            live on;

            # Viewers use our app on port 8080, not direct RTMP playback.
            deny play all;
            access_log off;

            # Called when a stream starts and ends
            on_publish http://server:8080/api/live/start;
            on_publish_done http://server:8080/api/live/end;

            # Write each stream as HLS to /hls/{stream_key}/index.m3u8
            hls on;
            hls_path /hls;
            hls_nested on;
        }
    }
}
